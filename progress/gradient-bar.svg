<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" width="320" height="40" role="img" aria-labelledby="t"><title id="t">Indeterminate gradient progress bar</title><defs><linearGradient id="g"><stop stop-color="#00d2fd"/><stop offset="1" stop-color="#895bfb"/></linearGradient><clipPath id="c"><rect x="2" y="10" width="316" height="20" rx="10"/></clipPath></defs><rect x="2" y="10" width="316" height="20" rx="10" fill="#1e2935"/><g clip-path="url(#c)"><rect x="-110" y="10" width="110" height="20" rx="10" fill="url(#g)"><animate attributeName="x" from="-110" to="320" dur="1.5s" repeatCount="indefinite"/></rect></g></svg>